name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (smoke on PR, full on push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bring up the real stack (frontend + backend + Postgres) that Playwright
      # drives. nginx is prod-only, so we use the dev compose file.
      - name: Start the stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build
          echo "Waiting for backend :3000 and frontend :5173..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/notes >/dev/null 2>&1 \
               && curl -sf http://localhost:5173 >/dev/null 2>&1; then
              echo "Stack is up."; exit 0
            fi
            sleep 3
          done
          echo "Stack did not become ready in time."; docker compose -f docker-compose.dev.yml logs; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests (smoke on PR, full suite on push/dispatch)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5173
          CI: 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:smoke
          else
            npm test
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
