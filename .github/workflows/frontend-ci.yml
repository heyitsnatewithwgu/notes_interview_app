name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read
  code-quality: write # upload coverage to GitHub Code Quality (feeds the coverage ruleset)

jobs:
  lint-build:
    name: Lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type-check & build
        run: npm run build

  test:
    name: Unit & component tests (coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vitest with coverage (fails below 70%)
        run: npm run test:cov
      # Publishes Cobertura coverage to GitHub Code Quality so the repository's
      # code-coverage ruleset can evaluate the PR. Best-effort: never blocks the
      # build (the threshold above is the hard gate). Requires Code Quality to be
      # enabled — see docs/platform/BRANCH_PROTECTION.md.
      - name: Upload coverage to GitHub Code Quality
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: frontend/coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/frontend
